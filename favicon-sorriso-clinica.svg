  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="112" fill="url(#blue)"/>

  <!-- Detalhe circular -->
  <circle cx="256" cy="256" r="164"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.20"
          stroke-width="8"/>

  <!-- Dente / sorriso estilizado -->
  <path d="M158 168
           C184 132 221 132 256 151
           C291 132 328 132 354 168
           C382 207 364 265 342 319
           C322 368 296 398 273 372
           C262 359 258 329 256 304
           C254 329 250 359 239 372
           C216 398 190 368 170 319
           C148 265 130 207 158 168Z"
        fill="#FFFFFF"/>

  <!-- Recorte interno para formar sorriso -->
  <path d="M193 241
           C226 270 286 270 319 241
           C311 292 285 319 256 319
           C227 319 201 292 193 241Z"
        fill="#0EA5E9"/>

  <!-- Brilho -->
  <path d="M194 183
           C212 165 232 163 249 171"
        fill="none"
        stroke="#BAE6FD"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Cruz clínica minimalista -->
  <g fill="#FFFFFF">
    <rect x="382" y="92" width="22" height="70" rx="8"/>
    <rect x="358" y="116" width="70" height="22" rx="8"/>
